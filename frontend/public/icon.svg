<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12805B"/>
      <stop offset="1" stop-color="#083A2A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DE97"/>
      <stop offset="1" stop-color="#C0912F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- banknote -->
  <g transform="rotate(-9 256 256)">
    <rect x="92" y="180" width="328" height="152" rx="22" fill="url(#gold)"/>
    <rect x="112" y="200" width="288" height="112" rx="14" fill="none" stroke="#7A5417" stroke-width="5" opacity="0.5"/>
    <!-- emerald seal -->
    <circle cx="256" cy="256" r="46" fill="#0E6A4A"/>
    <circle cx="256" cy="256" r="46" fill="none" stroke="#F6DE97" stroke-width="4" opacity="0.85"/>
    <!-- gold currency mark inside seal -->
    <rect x="250" y="222" width="12" height="68" rx="6" fill="#F6DE97"/>
    <rect x="230" y="240" width="52" height="11" rx="5.5" fill="#F6DE97"/>
    <rect x="230" y="262" width="52" height="11" rx="5.5" fill="#F6DE97"/>
    <!-- corner denomination dots -->
    <circle cx="130" cy="212" r="9" fill="#0E6A4A"/>
    <circle cx="382" cy="300" r="9" fill="#0E6A4A"/>
  </g>
</svg>
